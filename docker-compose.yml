services:

  postgres:
    image: postgres:16
    container_name: telecom-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom
      POSTGRES_DB: telecom_network

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecom_network"]
      interval: 5s
      timeout: 5s
      retries: 10


  kafka:
    image: apache/kafka:4.3.1
    container_name: telecom-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"


volumes:
  postgres_data:
